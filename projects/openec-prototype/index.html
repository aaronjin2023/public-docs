<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenEC 原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
  :root { --bg:#FFFFFF; --ink:#111827; --sub:#6B7280; --line:#E5E7EB; --or:#F2681D; color-scheme:light; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font:16px/1.6 "Noto Sans SC", system-ui, sans-serif; }
  main { max-width:720px; margin:0 auto; padding:72px 16px; }
  .brand { display:flex; align-items:center; gap:10px; font:800 22px "Plus Jakarta Sans", sans-serif; }
  .brand i { width:26px; height:26px; border-radius:7px; background:var(--or); display:grid; place-items:center; }
  .brand i::after { content:""; width:5px; height:13px; border-radius:2px; background:#fff; }
  h1 { margin:40px 0 8px; font-size:32px; line-height:1.3; }
  .lead { color:var(--sub); margin-bottom:32px; }
  a.card { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:20px 22px; margin-bottom:12px;
    border:1px solid var(--line); border-radius:12px; color:inherit; text-decoration:none; transition:border-color .2s, transform .2s; }
  a.card:hover, a.card:focus-visible { border-color:var(--or); transform:translateY(-1px); outline:none; }
  a.card b { display:block; font-size:18px; }
  a.card span { color:var(--sub); font-size:14px; }
  a.card em { font-style:normal; color:var(--or); font-weight:700; white-space:nowrap; }
  footer { margin-top:40px; color:var(--sub); font-size:13px; }
</style>
</head>
<body>
<main>
  <div class="brand"><i></i>OpenEC</div>
  <h1>界面原型</h1>
  <p class="lead">可点击的静态原型，数据都是演示用的，不连接真实店铺。</p>
  <a class="card" href="workspace.html"><div><b>工作区</b><span>整体框架：工作台、商品、核对、选品、定价、维护、设置</span></div><em>打开 →</em></a>
  <a class="card" href="products-page.html"><div><b>商品页</b><span>按登入的定价规则和优先级生效</span></div><em>打开 →</em></a>
  <a class="card" href="rule-page.html"><div><b>定价规则编辑页</b><span>规则参数、登入商品与预演</span></div><em>打开 →</em></a>
  <footer>OpenEC · 原型 · 2026-10-25</footer>
</main>
</body>
</html>
