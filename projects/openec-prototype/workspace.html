<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<title>OpenEC 工作区原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* 布局：白色侧栏（橙色滑块指示当前页）+ 暖白画布；工作台顶部是一块"深色屏幕"英雄区，与登录页里的产品截图同一语言；摘要在上、明细在下，详情进弹窗 */
:root{
  --canvas:#FAF9F6; --surface:#FFFFFF; --sunk:#F3F1EC; --ink:#111827; --ink-2:#4B5160; --ink-3:#8C909B; --line:#ECEAE4; --line-2:#DEDBD3;
  --or:#F2681D; --or-hi:#FF8A3D; --or-deep:#B9470A; --or-soft:#FFF0E6; --or-ink:#9A3505; --on-or:#FFFFFF;
  --screen:#12151C; --screen-2:#1B1F29; --screen-ink:#F4F1EC; --screen-mute:#9AA0AD; --screen-line:#2A2F3B;
  --ok:#15885A; --ok-soft:#E3F5EC; --warn:#B26A00; --warn-soft:#FFF3DB; --bad:#C8372D; --bad-soft:#FDE8E6; --mute-soft:#F1F0EC; --violet:#6D5BD0;
  --shadow:0 1px 2px rgba(17,24,39,.05),0 10px 30px -12px rgba(17,24,39,.18);
  --glow:0 10px 30px -8px rgba(242,104,29,.55);
  --font-display:"Plus Jakarta Sans","Noto Sans SC",sans-serif;
  --font-body:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans",Arial,sans-serif;
  --font-jp:"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --spring:cubic-bezier(.34,1.56,.64,1); --out:cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --canvas:#0C0D10; --surface:#15171C; --sunk:#1C1F26; --ink:#F3F1EC; --ink-2:#AEB2BC; --ink-3:#757A86; --line:#23262E; --line-2:#30343E;
  --or:#FF7A2E; --or-hi:#FF9A55; --or-deep:#E05A12; --or-soft:#3A2114; --or-ink:#FFB27F; --on-or:#160A03;
  --screen:#07080B; --screen-2:#12141A; --screen-line:#22252E;
  --ok:#3CCB8A; --ok-soft:#10291F; --warn:#F2B347; --warn-soft:#33260E; --bad:#FF7468; --bad-soft:#3A1715; --mute-soft:#1E2128; --violet:#9B8CFF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --canvas:#0C0D10; --surface:#15171C; --sunk:#1C1F26; --ink:#F3F1EC; --ink-2:#AEB2BC; --ink-3:#757A86; --line:#23262E; --line-2:#30343E;
  --or:#FF7A2E; --or-hi:#FF9A55; --or-deep:#E05A12; --or-soft:#3A2114; --or-ink:#FFB27F; --on-or:#160A03;
  --screen:#07080B; --screen-2:#12141A; --screen-line:#22252E;
  --ok:#3CCB8A; --ok-soft:#10291F; --warn:#F2B347; --warn-soft:#33260E; --bad:#FF7468; --bad-soft:#3A1715; --mute-soft:#1E2128; --violet:#9B8CFF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--canvas);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.7;letter-spacing:.01em;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--or);outline-offset:2px}
::selection{background:var(--or);color:#fff}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:0}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
[lang="ja"]{font-family:var(--font-jp)}

/* 外壳 */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px calc(16px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));z-index:20}
.logo{display:block;height:30px;width:auto;margin:0 10px 22px;align-self:flex-start}
.store{margin:0 2px 14px;padding:12px;border-radius:14px;background:var(--sunk);display:flex;align-items:center;gap:10px;border:0;text-align:left;cursor:pointer;width:calc(100% - 4px)}
.store small{display:block;color:var(--ink-3);font-size:11px}
.live{position:relative;width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.live::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--ok);animation:ping 1.8s var(--out) infinite}
@keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.8);opacity:0}}
.search-btn{margin:0 2px 8px;display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink-3);cursor:pointer;font-size:13px;transition:border-color .2s}
.search-btn:hover{border-color:var(--or);color:var(--ink)}
.search-btn kbd{margin-left:auto}
.nav{position:relative;display:flex;flex-direction:column;gap:2px}
.nav-ind{position:absolute;left:0;right:0;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--or-hi),var(--or) 50%,var(--or-deep));box-shadow:var(--glow);transition:transform .45s var(--spring);z-index:0}
.nav-label{font-size:10.5px;letter-spacing:.18em;color:var(--ink-3);padding:16px 14px 6px}
.nav button{position:relative;z-index:1;display:flex;align-items:center;gap:12px;height:42px;padding:0 14px;border-radius:12px;border:0;background:transparent;color:var(--ink-2);cursor:pointer;text-align:left;font-size:14px;transition:color .25s}
.nav button:hover:not([aria-current]){background:var(--sunk);color:var(--ink)}
.nav button[aria-current="page"]{color:#fff;font-weight:500}
.nav .badge{margin-left:auto;font-family:var(--font-mono);font-size:11px;padding:1px 8px;border-radius:999px;background:var(--or-soft);color:var(--or-ink);transition:background .25s,color .25s}
.nav button[aria-current="page"] .badge{background:rgba(255,255,255,.22);color:#fff}
.rail-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;font-size:13px}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--or-hi),var(--or-deep));color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
main{min-width:0}
.page{max-width:1340px;margin:0 auto;padding-block:28px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:901px){.page{padding-left:40px;padding-right:max(40px,env(safe-area-inset-right,0px))}}
.enter{animation:pageIn .55s var(--out) both}
@keyframes pageIn{from{opacity:.25;transform:translateY(14px);filter:blur(4px)}}
.stagger>*{animation:rise .6s var(--out) both}
.stagger>*:nth-child(2){animation-delay:.06s}.stagger>*:nth-child(3){animation-delay:.12s}.stagger>*:nth-child(4){animation-delay:.18s}.stagger>*:nth-child(5){animation-delay:.24s}
@keyframes rise{from{opacity:.2;transform:translateY(16px)}}
.ph{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:24px}
.eyebrow{font-family:var(--font-display);font-size:12px;letter-spacing:.18em;color:var(--or);font-weight:700;text-transform:uppercase;margin:0 0 8px}
.ph h1{font-weight:700;font-size:32px;line-height:1.3;letter-spacing:.01em;margin:0;text-wrap:balance}
.ph p{margin:8px 0 0;color:var(--ink-2);max-width:62ch}
.ph .actions{display:flex;gap:10px;flex-wrap:wrap}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;gap:6px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));padding-top:calc(10px + env(safe-area-inset-top,0px));overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .logo{height:22px;margin:0 6px 0 0;align-self:center}
  .store,.rail-foot,.nav-label,.search-btn,.nav-ind,.proto{display:none}
  .nav{flex-direction:row} .nav button{white-space:nowrap;height:36px;padding:0 12px} .nav .badge{display:none}
  .nav button[aria-current="page"]{background:var(--or);color:#fff}
  .ph h1{font-size:26px}
}

/* 控件 */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap;transition:transform .2s var(--spring),border-color .2s,box-shadow .2s,background .2s}
.btn:hover{border-color:var(--ink-3);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--or-hi),var(--or) 45%,var(--or-deep));border-color:transparent;color:#fff;box-shadow:var(--glow)}
.btn.primary::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shine 3.6s ease-in-out infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink-2)} .btn.quiet:hover{background:var(--sunk);color:var(--ink)}
.btn.glass{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#fff;backdrop-filter:blur(8px)} .btn.glass:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.32)}
.btn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:9px}
.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none} .btn[aria-disabled="true"]::after{display:none}
kbd{font-family:var(--font-mono);font-size:10.5px;line-height:1;padding:3px 6px;border-radius:5px;border:1px solid currentColor;opacity:.65}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--mute-soft);color:var(--ink-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.plain::before{display:none}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.or{background:var(--or-soft);color:var(--or-ink)}
.pill.pulse::before{animation:blink 1.4s ease-in-out infinite} @keyframes blink{50%{opacity:.25}}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;min-width:0;transition:transform .35s var(--out),box-shadow .35s,border-color .35s}
.card.hover:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--line-2)}
.spot::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(242,104,29,.1),transparent 45%);opacity:0;transition:opacity .3s}
.spot:hover::before{opacity:1}
.card h2{font-size:13px;font-weight:500;color:var(--ink-2);margin:0 0 16px;display:flex;align-items:center;gap:8px}
.card h2 .r{margin-left:auto}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid-main{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:18px}
@media (max-width:1060px){.grid-main{grid-template-columns:1fr}}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.input{height:40px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface);padding:0 14px;font:inherit;color:var(--ink);width:100%;min-width:0;transition:border-color .2s,box-shadow .2s}
.input:focus{outline:none;border-color:var(--or);box-shadow:0 0 0 4px var(--or-soft)}
textarea.input{height:auto;padding:10px 14px;resize:vertical;line-height:1.5}
label.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2);min-width:0}
.switch{width:46px;height:28px;border-radius:999px;border:0;background:var(--line-2);position:relative;cursor:pointer;flex:none;transition:background .3s,box-shadow .3s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .45s var(--spring)}
.switch[aria-checked="true"]{background:var(--or);box-shadow:var(--glow)} .switch[aria-checked="true"]::after{transform:translateX(18px)}
.switch.big{width:84px;height:46px;background:#3A3F4C} .switch.big::after{width:38px;height:38px;top:4px;left:4px} .switch.big[aria-checked="true"]{background:var(--or)} .switch.big[aria-checked="true"]::after{transform:translateX(38px)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);transition:all .25s var(--out)}
.chip .c{font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}
.chip:hover{border-color:var(--or);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--canvas);transform:scale(1.03)} .chip[aria-pressed="true"] .c{color:var(--or-hi)}
.seg{display:inline-flex;padding:4px;border-radius:13px;background:var(--sunk);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;height:32px;padding:0 14px;border-radius:9px;cursor:pointer;font-size:13px;color:var(--ink-2);transition:all .25s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px -2px rgba(17,24,39,.2)}
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{border:0;background:none;padding:12px 0;cursor:pointer;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color .2s}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--or);font-weight:500}

/* 英雄区（深色屏幕） */
.hero{position:relative;overflow:hidden;border-radius:28px;background:var(--screen);color:var(--screen-ink);padding:36px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:center;isolation:isolate}
.blob{position:absolute;border-radius:50%;filter:blur(60px);z-index:-1;pointer-events:none}
.hero .b1{width:440px;height:440px;background:radial-gradient(circle,rgba(242,104,29,.85),transparent 65%);right:-90px;top:-170px;animation:drift 14s ease-in-out infinite alternate}
.hero .b2{width:380px;height:380px;background:radial-gradient(circle,rgba(185,71,10,.8),transparent 65%);left:30%;bottom:-230px;animation:drift 18s ease-in-out infinite alternate-reverse}
.hero .b3{width:240px;height:240px;background:radial-gradient(circle,rgba(109,91,208,.45),transparent 65%);left:-70px;top:-90px;animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(-60px,40px) scale(1.15)}}
.grid-bg{position:absolute;inset:0;z-index:-1;background-image:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1px);background-size:22px 22px;-webkit-mask-image:linear-gradient(90deg,#000 25%,transparent 85%);mask-image:linear-gradient(90deg,#000 25%,transparent 85%)}
.hero h2{font-weight:700;font-size:clamp(26px,3.2vw,40px);line-height:1.35;letter-spacing:.01em;margin:14px 0 14px;text-wrap:balance}
.hero h2 em{font-style:normal;background:linear-gradient(90deg,var(--or-hi),#FFC49A,var(--or-hi));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 4s linear infinite}
.hero p{color:var(--screen-mute);margin:0 0 24px;max-width:46ch}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap}
.live-tag{display:inline-flex;align-items:center;gap:10px;font-size:12px;color:var(--screen-mute);padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.donut-wrap{display:flex;align-items:center;gap:24px;justify-content:center;flex-wrap:wrap}
.donut{width:216px;height:216px;flex:none;filter:drop-shadow(0 10px 30px rgba(242,104,29,.25))}
.donut circle{fill:none;stroke-width:15;transition:stroke-dasharray 1.3s var(--out)}
.dl{display:flex;flex-direction:column;gap:6px;min-width:160px}
.dl button{all:unset;cursor:pointer;display:grid;grid-template-columns:10px 1fr auto;gap:12px;align-items:center;font-size:13px;color:var(--screen-mute);padding:6px 10px;margin:0 -10px;border-radius:9px;transition:background .2s,color .2s}
.dl button:hover{background:rgba(255,255,255,.07);color:#fff}
.dl .sw{width:10px;height:10px;border-radius:3px}
.dl .v{font-family:var(--font-mono);color:#fff}
@media (max-width:900px){.hero{grid-template-columns:1fr;padding:24px;border-radius:22px}}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin:18px 0}
@media (max-width:1060px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.kpis{grid-template-columns:1fr}}
.kpi .k{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.kpi .v{font-family:var(--font-display);font-weight:700;font-size:34px;letter-spacing:-.01em;line-height:1.2;margin:10px 0 2px}
.kpi .v small{font-family:var(--font-mono);font-size:13px;font-weight:400;color:var(--ink-3);letter-spacing:0;margin-left:6px}
.kpi .d{font-size:12px;color:var(--ink-3)}
svg.spark{display:block;width:100%;height:46px;margin-top:12px;overflow:visible}
.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.5s var(--out) .25s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.next-row{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 12px;margin:0 -12px;border-radius:14px;transition:background .2s}
.next-row:hover{background:var(--sunk)}
.next-row .n{font-family:var(--font-display);font-size:30px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.next-row .h{font-weight:500}
.next-row .d{font-size:12.5px;color:var(--ink-2)}
.next-row .bar{height:4px;border-radius:999px;background:var(--sunk);margin-top:8px;overflow:hidden;max-width:320px}
.next-row .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--or-hi),var(--or-deep));border-radius:inherit;transform-origin:left;animation:grow 1.2s var(--out) .3s both}
@keyframes grow{from{transform:scaleX(0)}}
.next-row.zero .n{color:var(--ink-3)}
@media (max-width:560px){.next-row{grid-template-columns:52px minmax(0,1fr)}.next-row .btn{grid-column:2;justify-self:start}}
.meter{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden} .meter>i{display:block;height:100%;background:linear-gradient(90deg,var(--or-hi),var(--or-deep));border-radius:999px;transform-origin:left;animation:grow 1.2s var(--out) both}
.feed{list-style:none;margin:0;padding:0;position:relative}
.feed::before{content:"";position:absolute;left:5px;top:6px;bottom:20px;width:2px;background:var(--line)}
.feed li{position:relative;padding:0 0 16px 26px;font-size:13px}
.feed li::before{content:"";position:absolute;left:0;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--or)}
.feed li:first-child::before{background:var(--or);box-shadow:0 0 0 4px var(--or-soft)}
.feed .tm{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);display:block}
.perm{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:13px}
.perm:first-of-type{border-top:0}

/* 表格 */
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.tablescroll{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;min-width:960px}
.t th{text-align:left;font-weight:500;font-size:11.5px;color:var(--ink-3);letter-spacing:.06em;padding:13px 18px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:12px 18px;border-bottom:1px solid var(--line);vertical-align:middle}

/* ---------- hooks ---------- */
function useCount(target,dur=900){ const [v,setV]=useState(REDUCED?target:0); const prev=useRef(0);
  useEffect(()=>{ if(REDUCED){setV(target);return;} const from=prev.current,t0=performance.now(); let raf;
    const step=t=>{ const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,4); setV(from+(target-from)*e); if(p<1) raf=requestAnimationFrame(step); else prev.current=target; };
    raf=requestAnimationFrame(step); return ()=>{cancelAnimationFrame(raf);prev.current=target;}; },[target]); return v; }
function Count({v}){ return html`${Math.round(useCount(v))}`; }
function Price({v}){ return html`$${useCount(v,500).toFixed(2)}`; }
const spotMove=e=>{ const el=e.currentTarget, b=el.getBoundingClientRect(); el.style.setProperty("--mx",(e.clientX-b.left)+"px"); el.style.setProperty("--my",(e.clientY-b.top)+"px"); };

function Spark({data,w=92,h=28,color="var(--or)",fill,cls="mini",draw}){ const mn=Math.min(...data),mx=Math.max(...data),sx=w/(data.length-1),sy=v=>h-3-(v-mn)/((mx-mn)||1)*(h-6);
  const d=data.map((v,i)=>(i?"L":"M")+(i*sx).toFixed(1)+" "+sy(v).toFixed(1)).join("");
  return html`<svg class=${cls} viewBox=${`0 0 ${w} ${h}`} preserveAspectRatio="none" aria-hidden="true">
    ${fill&&html`<path d=${d+`L${w} ${h}L0 ${h}Z`} fill=${color} opacity=".12"/>`}
    <path class=${draw?"draw":""} pathLength=${draw?100:undefined} style=${draw?{"--len":100}:null} d=${d} fill="none" stroke=${color} stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`; }

function Modal({title,onClose,children,footer,width,cls,head}){

      ${children}${footer&&html`<div class="modal-f">${footer}</div>`}</div></div>`; }
function Pager({page,set,total,size=20}){ const pages=Math.max(1,Math.ceil(total/size)),a=total?(page-1)*size+1:0,b=Math.min(page*size,total),list=[];
  for(let p=1;p<=pages;p++){ if(p===1||p===pages||Math.abs(p-page)<=1) list.push(p); else if(list[list.length-1]!=="…") list.push("…"); }

function Donut({segs,total,go}){ const R=42,C=2*Math.PI*R; const [on,setOn]=useState(REDUCED); useEffect(()=>{const t=setTimeout(()=>setOn(true),120);return ()=>clearTimeout(t)},[]);
  let acc=0; const ready=segs.filter(s=>s[3]==="bound"||s[3]==="pilot").reduce((a,s)=>a+s[1],0);
  return html`<div class="donut-wrap"><svg class="donut" viewBox="0 0 100 100" role="img" aria-label=${`已能定价 ${ready} / ${total}`}>
    <circle cx="50" cy="50" r=${R} stroke="rgba(255,255,255,.06)"/>
    ${segs.map(s=>{ const len=s[1]/total*C, el=html`<circle key=${s[0]} cx="50" cy="50" r=${R} stroke=${s[2]} transform="rotate(-90 50 50)" style=${{strokeDasharray:on?`${Math.max(0,len-1.2)} ${C}`:`0 ${C}`,strokeDashoffset:-acc}}/>`; acc+=len; return el; })}

    ${st==="live"&&html`<div class="card empty"><b>还没有从选品上架的商品</b>审批通过、店铺授权写入后，就能从「待上架」上架。</div>`}
    ${st!=="strategy"&&st!=="live"&&html`<div class="tablewrap"><div class="tablescroll"><table class="t"><thead><tr><th>商品</th><th class="r">采购价</th><th>30 天走势</th><th class="r">预估售价</th><th class="r">近 30 天售出</th><th></th><th></th></tr></thead><tbody>
      ${shown.map((x,i)=>html`<tr key=${x.key} style=${{animationDelay:(i*18)+"ms"}} onClick=${()=>st==="candidate"&&setAppr(x)}><td><${TitleCell} it=${x} jp=${true}/></td><td class="r mono">￥${x.jpy.toLocaleString()}</td><td><${Spark} data=${x.hist}/></td><td class="r mono" style=${{fontWeight:500}}>$${x.est.toFixed(2)}</td><td class="r mono">${x.sold30}</td>
        <td>${x.dup&&html`<span title="店里已有同一个 ASIN 的刊登"><${Pill} tone="warn">疑似重复<//></span>`}</td><td class="r">${action(x)}</td></tr>`)}</tbody></table></div>
      <${Pager} page=${page} set=${setPage} total=${rows.length}/></div>`}
    </div>
    ${appr&&html`<${Approval} it=${appr} onClose=${()=>setAppr(null)}/>`}
  </div>`;
}

/* ---------- 定价 ---------- */
function Pricing({data}){
  const [edit,setEdit]=useState(false); const [profit,setProfit]=useState(8); const [min,setMin]=useState(18);
  const bound=data.filter(x=>x.link==="bound"), ok=bound.filter(x=>x.source==="in"), blk=bound.length-ok.length;
  return html`<div>
    <${Head} eyebrow="Pricing" title="定价规则" desc="按类别和店铺定规则。启用前先预演，看每条商品会改成多少。" actions=${html`<${Btn} kind="primary" icon="plus" onClick=${()=>setEdit(true)}>新建规则<//>`}/>
    <section class="card hover spot" style=${{cursor:"pointer"}} onClick=${()=>setEdit(true)} onMouseMove=${spotMove}>
      <div style=${{display:"flex",flexWrap:"wrap",alignItems:"center",gap:12,marginBottom:16}}><div style=${{fontWeight:700,fontSize:22}}>日版 CD 标准</div><${Pill}>草稿<//><span class="sub">Music › CDs · 全部店铺 · 命中 <span class="mono">${bound.length}</span> 条</span><span style=${{marginLeft:"auto"}}><${Btn} sm icon="edit">编辑与预演<//></span></div>
      <div class="formula"><span>采购价 ÷ ${FX}</span><i>+</i><span>运费 $14.00</span><i>+</i><span>固定费 $0.30</span><i>+</i><span>利润 $${profit.toFixed(2)}</span><i>÷</i><span>(1 − eBay 费 14.9%)</span><i>→</i><span>限在 $${min} – $120</span><i>·</i><span>单次变动 ≤ 15%</span></div></section>
    ${edit&&html`<${Modal} title="日版 CD 标准" onClose=${()=>setEdit(false)} footer=${html`<${Btn} kind="quiet" onClick=${()=>setEdit(false)}>取消<//><${Btn} onClick=${()=>{toast("已存为草稿");setEdit(false)}}>存为草稿<//><${Btn} kind="primary" onClick=${()=>{toast("规则已启用");setEdit(false)}}>启用<//>`}>
      <div class="modal-b"><div class="grid2" style=${{alignItems:"start"}}>
        <section class="card"><h2>参数</h2><div class="fields">
          <label class="field">适用类别<select id="rule-cat" class="input"><option>Music › CDs</option></select></label><label class="field">适用店铺<select id="rule-store" class="input"><option>全部店铺</option><option>demo-store-jp</option></select></label>
          <label class="field">目标利润（$）<input id="rule-profit" class="input mono" type="number" step="0.5" value=${profit} onInput=${e=>setProfit(Math.max(0,+e.target.value||0))}/></label>
          <label class="field">售价下限（$）<input id="rule-min" class="input mono" type="number" value=${min} onInput=${e=>setMin(+e.target.value||0)}/></label>
          <label class="field">国际运费（$）<input id="rule-ship" class="input mono" defaultValue="14"/></label><label class="field">eBay 费率（%）<input id="rule-fee" class="input mono" defaultValue="14.9"/></label>
          <label class="field">汇率（¥/$）<input id="rule-fx" class="input mono" defaultValue="150"/></label><label class="field">单次最大变动（%）<input id="rule-step" class="input mono" defaultValue="15"/></label></div></section>
        <section class="card"><h2>预演 <span class="faint" style=${{fontWeight:400}}>· 改参数立刻重算</span></h2>
          <div class="stat-row" style=${{marginBottom:16}}><div class="stat"><div class="v">${bound.length}</div><div class="k">命中</div></div><div class="stat"><div class="v" style=${{color:"var(--or)"}}>${ok.length}</div><div class="k">会改价</div></div><div class="stat"><div class="v" style=${{color:blk?"var(--warn)":""}}>${blk}</div><div class="k">被拦下</div></div></div>
          ${blk>0&&html`<div class="note warn" style=${{marginBottom:12}}><${Ic} n="alert"/><div><b>${blk} 条来源缺货或状态未知</b>这些这次不会改价。</div></div>`}
          <div>${bound.slice(0,8).map(x=>{const np=Math.max(min,calc(x.bound.jpy,profit)); return html`<div key=${x.key} style=${{display:"grid",gridTemplateColumns:"minmax(0,1fr) auto",gap:12,alignItems:"center",padding:"10px 0",borderTop:"1px solid var(--line)"}}>
            <${TitleCell} it=${x}/><div class="mono" style=${{textAlign:"right",fontSize:12.5,whiteSpace:"nowrap"}}>${x.source==="in"?html`<span class="faint">$${x.usd.toFixed(2)} → </span><b style=${{color:np>x.usd?"var(--ok)":"var(--bad)"}}><${Price} v=${np}/></b>`:html`<${SrcPill} s=${x.source}/>`}</div></div>`;})}</div></section>
      </div></div><//>`}
  </div>`;
}

/* ---------- 维护 ---------- */
function Maintenance({data,open}){
  const [on,setOn]=useState(false); const [ask,setAsk]=useState(false);
  const pilot=data.filter(x=>x.maint==="pilot"), paused=data.filter(x=>x.maint==="paused");
  const runs=[["10-20 21:05",[[pilot[0],"改价 $31.40 → $29.90","ok","已从 eBay 读回确认"],[pilot[1],"价格已在目标，未改动","skip",""],[pilot[2],"跳过","skip","来源状态未知，不当作缺货"]]],["10-20 20:05",[[pilot[0],"库存保持 2","skip",""],[pilot[1],"改价 $27.10 → $28.40","ok","已从 eBay 读回确认"]]]];
  const ecg="M0 30 H110 L122 30 L130 8 L140 52 L150 30 H250 L262 30 L270 4 L280 56 L290 30 H400";
  return html`<div>
    <${Head} eyebrow="Automation" title="维护" desc="按规则自动调价，来源确认缺货时把库存归零。先只在你指定的 3 个商品上试点。"/>
    <div class="safety stagger">
      <section class=${"card power"+(on?" on":"")}><span class="halo"></span><h2 style=${{color:"#9AA0AD"}}><${Ic} n="shield" s=${15}/>自动维护</h2>
        <div style=${{display:"flex",alignItems:"center",gap:20}}><${Switch} big on=${on} set=${v=>v?setAsk(true):setOn(false)} label="自动维护总开关"/><div><div class="state">${on?"运行中":"已关闭"}</div><div class="sub">${on?"每小时一次 · 只处理试点商品":"关闭时只能手动执行单次"}</div></div></div>
        <svg class="pulse" viewBox="0 0 400 60" preserveAspectRatio="none" aria-hidden="true"><line x1="0" y1="30" x2="400" y2="30" stroke="rgba(255,255,255,.08)"/>
          ${on?html`<path d=${ecg} fill="none" stroke="rgba(255,138,61,.35)" stroke-width="2"/><path class="beat" pathLength="600" d=${ecg} fill="none" stroke="#FF8A3D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`:html`<path d="M0 30 H400" fill="none" stroke="#5F6573" stroke-width="2" stroke-dasharray="4 6"/>`}</svg>
        <div style=${{marginTop:12,display:"flex",gap:8,flexWrap:"wrap"}}><${Btn} kind="glass" icon="play" onClick=${()=>toast("已对 3 个试点商品执行一次")}>手动执行一次<//></div>
        <p class="sub" style=${{marginBottom:0,fontSize:12}}>每次改动都先预演、再执行、再从 eBay 读回确认；读回不一致就记为失败，并停下这一条。</p></section>
      <section class="card"><h2>试点位 <span class="mono faint">${pilot.length}/3</span></h2>
        <div class="slots">${[0,1,2].map(i=>pilot[i]?html`<button key=${i} class="slot" onClick=${()=>open(pilot[i].key)}><span class="n">0${i+1}</span><${Cover} it=${pilot[i]} size=${64}/><div style=${{minWidth:0,width:"100%"}}><div class="s1">${pilot[i].artist}</div><div class="sub" style=${{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>${pilot[i].album}</div></div><${Pill} tone="or" pulse>试点中<//></button>`:html`<button key=${i} class="slot empty"><${Ic} n="plus"/>指定商品</button>`)}</div>
        <p class="sub" style=${{marginBottom:0}}>要换试点商品，在商品详情里移出后再指定新的。</p></section></div>
    <div class="tabs" style=${{marginTop:28}} role="tablist"><button role="tab" aria-selected="true">执行记录</button><button role="tab" aria-selected="false">人工暂停 <span class="mono faint">${paused.length}</span></button><button role="tab" aria-selected="false">需要处理 <span class="mono faint">0</span></button></div>
    <section class="card">${runs.map(rn=>html`<div class="run" key=${rn[0]}><div class="rt">${rn[0]}<div class="faint" style=${{fontSize:11,marginTop:2}}>${rn[1].length} 个商品</div></div><ul>
      ${rn[1].map((e,i)=>html`<li key=${i}><div class="tc"><${Cover} it=${e[0]} size=${36}/><div class="tt"><div class="t1" style=${{maxWidth:380}}>${e[1]}</div><div class="t2">${e[0].artist} · ${e[0].album}${e[3]?" · "+e[3]:""}</div></div></div>
        ${e[2]==="ok"?html`<${Pill} tone="ok">成功<//>`:e[2]==="fail"?html`<${Pill} tone="bad">失败<//>`:html`<${Pill}>未改动<//>`}</li>`)}</ul></div>`)}</section>
    ${ask&&html`<${Modal} title="开启自动维护？" width=${500} onClose=${()=>setAsk(false)} footer=${html`<${Btn} kind="quiet" onClick=${()=>setAsk(false)}>先不开<//><${Btn} kind="primary" icon="bolt" onClick=${()=>{setOn(true);setAsk(false);toast("自动维护已开启")}}>开启<//>`}>
      <div class="modal-b"><p style=${{margin:0}}>开启后，系统每小时会对 <b>${pilot.length}</b> 个试点商品按规则调价；来源确认缺货时把库存归零。</p>
      <div class="note"><${Ic} n="shield"/><div>来源状态未知时不会动库存；人工暂停的商品不会被自动恢复。</div></div></div><//>`}
  </div>`;
}

/* ---------- 设置 ---------- */

    <${Head} eyebrow="Settings" title="设置"/>
    <div class="tabs" role="tablist">${[["store","店铺"],["users","用户与邀请"],["usage","用量"]].map(t=>html`<button key=${t[0]} role="tab" aria-selected=${tab===t[0]?"true":"false"} onClick=${()=>setTab(t[0])}>${t[1]}</button>`)}</div>

    ${tab==="store"&&html`<div class="strat">
      <section class="card hover spot" onMouseMove=${spotMove}><div style=${{display:"flex",alignItems:"center",gap:12,marginBottom:16}}><span class="avatar"><${Ic} n="store" s=${16}/></span><div><div style=${{fontWeight:700}}>demo-store-jp</div><div class="sub">eBay 美国 · 经 openec.ai 连接</div></div></div>
        <div class="perm"><span>读取刊登</span><${Pill} tone="ok">已授权<//></div><div class="perm"><span>改价、改库存、上架</span><${Pill} tone="warn" pulse>未授权<//></div><div class="perm"><span>同步频率</span><span class="muted">每天 1 次</span></div>

      <button class="dash-add"><span style=${{display:"flex",flexDirection:"column",alignItems:"center",gap:8}}><${Ic} n="plus" s=${24}/>连接新店铺</span></button></div>`}
    ${tab==="users"&&html`<div><div style=${{display:"flex",justifyContent:"flex-end",marginBottom:14}}><${Btn} kind="primary" icon="plus" onClick=${()=>setInv(true)}>邀请用户<//></div>
      <div class="tablewrap"><div class="tablescroll"><table class="t" style=${{minWidth:560}}><thead><tr><th>用户</th><th>客户</th><th>角色</th><th>状态</th></tr></thead><tbody>
        <tr><td><div class="tc"><span class="avatar">A</span><div><div style=${{fontWeight:500}}>Alex</div><div class="t2">alex@…</div></div></div></td><td>Demo Trading</td><td>管理员</td><td><${Pill} tone="ok">正常<//></td></tr>
        <tr><td><div class="tc"><span class="avatar" style=${{background:"var(--line-2)",color:"var(--ink-2)"}}>?</span><div><div style=${{fontWeight:500}}>partner@…</div><div class="t2">10-20 发出</div></div></div></td><td>新客户</td><td>客户管理员</td><td><${Pill} pulse>邀请待接受<//></td></tr></tbody></table></div></div></div>`}
    ${tab==="usage"&&html`<div class="strat">${[["Keepa · 本月",62,"/ 180",34],["AI 改写与比对 · 本月",144,"次",22]].map(u=>html`<section class="card" key=${u[0]}><h2>${u[0]}</h2><div class="stat"><div class="v"><${Count} v=${u[1]}/> <span class="faint" style=${{fontSize:16}}>${u[2]}</span></div></div><div class="meter" style=${{marginTop:14}}><i style=${{width:u[3]+"%"}}></i></div></section>`)}</div>`}
    </div>
    ${inv&&html`<${Modal} title="邀请用户" width=${500} onClose=${()=>setInv(false)} footer=${html`<${Btn} kind="quiet" onClick=${()=>setInv(false)}>取消<//><${Btn} kind="primary" onClick=${()=>{toast("已生成一次性邀请链接");setInv(false)}}>生成邀请链接<//>`}>
      <div class="modal-b"><label class="field">邮箱<input id="invite-email" class="input" placeholder="name@example.com"/></label>
      <label class="field">加入哪个客户<select id="invite-tenant" class="input"><option>新建客户（数据完全独立）</option><option>Demo Trading（和我共用）</option></select></label></div><//>`}
  </div>`;

/* ---------- 命令面板 ---------- */
function Cmdk({onClose,go,open,data}){
  const [q,setQ]=useState(""); const [i,setI]=useState(0); const ref=useRef(null); useEffect(()=>{ ref.current&&ref.current.focus(); },[]);
  const pages=NAV.filter(n=>!q||n.label.includes(q)).map(n=>({grp:"页面",label:n.label,icon:n.icon,run:()=>go(n.key)}));
  const items=q?data.filter(x=>(x.titleEn+x.itemId+x.asin+x.cat).toLowerCase().includes(q.toLowerCase())).slice(0,6).map(x=>({grp:"商品",label:x.titleEn,sub:"#"+x.itemId,it:x,run:()=>open(x.key)})):[];
  const all=pages.concat(items), run=k=>{ const a=all[k]; if(!a) return; onClose(); a.run(); };
  return html`<${Modal} onClose=${onClose} head=${false} cls="cmdk" width=${640}>
    <input id="cmdk-input" ref=${ref} placeholder="搜商品、跳转页面…" value=${q} onInput=${e=>{setQ(e.target.value);setI(0)}} onKeyDown=${e=>{ if(e.key==="ArrowDown"){e.preventDefault();setI(Math.min(i+1,all.length-1))} else if(e.key==="ArrowUp"){e.preventDefault();setI(Math.max(i-1,0))} else if(e.key==="Enter") run(i); }}/>
    <ul>${all.map((a,k)=>html`${(k===0||all[k-1].grp!==a.grp)&&html`<li key=${"g"+k} class="grp">${a.grp}</li>`}<li key=${k}><button data-active=${k===i?"true":"false"} onMouseEnter=${()=>setI(k)} onClick=${()=>run(k)}>
      ${a.it?html`<${Cover} it=${a.it} size=${30}/>`:html`<${Ic} n=${a.icon}/>`}<span style=${{minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>${a.label}</span>${a.sub&&html`<span class="mono faint" style=${{marginLeft:"auto",fontSize:11}}>${a.sub}</span>`}</button></li>`)}
      ${all.length===0&&html`<li class="empty" style=${{padding:24}}>没有找到</li>`}</ul><//>`;
}

/* ---------- 外壳 ---------- */
const NAV=[{key:"workspace",label:"工作台",icon:"home"},{key:"products",label:"商品",icon:"disc"},{key:"review",label:"核对",icon:"check"},{key:"sourcing",label:"选品",icon:"search"},{key:"pricing",label:"定价",icon:"tag"},{key:"maintenance",label:"维护",icon:"shield"},{key:"settings",label:"设置",icon:"sliders"}];
function Nav({page,go,badge}){
  const ref=useRef(null); const [y,setY]=useState(null);
  useLayoutEffect(()=>{ const nav=ref.current; if(!nav) return; const m=()=>{ const el=nav.querySelector('[aria-current="page"]'); if(el) setY(el.offsetTop); };
    m(); const ro=new ResizeObserver(m); ro.observe(nav); document.fonts&&document.fonts.ready.then(m); return ()=>ro.disconnect(); },[page]);
  const item=n=>html`<button key=${n.key} aria-current=${page===n.key?"page":undefined} onClick=${()=>go(n.key)}><${Ic} n=${n.icon}/>${n.label}${badge[n.key]?html`<span class="badge">${badge[n.key]}</span>`:null}</button>`;
  return html`<nav class="nav" aria-label="主导航" ref=${ref}>${y!=null&&html`<span class="nav-ind" style=${{top:0,transform:`translateY(${y}px)`}}></span>`}
    <div class="nav-label">日常</div>${NAV.slice(0,3).map(item)}<div class="nav-label">经营</div>${NAV.slice(3).map(item)}</nav>`;
}
function App(){
  const init=(location.hash||"").slice(1);
  const [page,setPage]=useState(NAV.some(n=>n.key===init)?init:"workspace"); const [arg,setArg]=useState(null);
  const [data,setData]=useState(LISTINGS); const [openKey,setOpenKey]=useState(null); const [cmd,setCmd]=useState(false);
  const update=(k,p)=>setData(d=>d.map(x=>x.key===k?Object.assign({},x,p):x));
  const go=(p,a)=>{ setPage(p); setArg(a==null?null:a); try{history.replaceState(null,"","#"+p)}catch(e){} window.scrollTo(0,0); };
  useEffect(()=>{ const h=e=>{ if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();setCmd(c=>!c);} }; window.addEventListener("keydown",h); return ()=>window.removeEventListener("keydown",h); },[]);
  const it=openKey==null?null:data.find(x=>x.key===openKey);
  const badge={review:data.filter(x=>x.link==="pending").length,sourcing:RESEARCH.filter(x=>x.stage==="candidate").length};
  const views={workspace:html`<${Workspace} data=${data} go=${go}/>`,products:html`<${Products} data=${data} open=${setOpenKey} arg=${page==="products"?arg:null}/>`,
    review:html`<${Review} data=${data} update=${update} arg=${page==="review"?arg:null} active=${page==="review"}/>`,sourcing:html`<${Sourcing} arg=${page==="sourcing"?arg:null}/>`,
    pricing:html`<${Pricing} data=${data}/>`,maintenance:html`<${Maintenance} data=${data} open=${setOpenKey}/>`,settings:html`<${Settings}/>`};
  return html`<div class="app">
    <aside class="rail">
      <img class="logo" src=${WORDMARK} alt="OpenEC"/>
      <div class="proto">原型 · 示例数据</div>
      <button class="store" title="切换店铺"><span class="live"></span><span style=${{minWidth:0}}><b style=${{fontWeight:500}}>demo-store-jp</b><small>eBay 美国 · 137 条</small></span></button>
      <button class="search-btn" onClick=${()=>setCmd(true)}><${Ic} n="search" s=${15}/>搜索商品或页面<kbd>⌘K</kbd></button>
      <${Nav} page=${page} go=${go} badge=${badge}/>
      <div class="rail-foot"><span class="avatar">A</span><div style=${{minWidth:0}}><div style=${{fontWeight:500}}>Alex</div><div class="faint" style=${{fontSize:11}}>管理员 · Demo Trading</div></div></div>
    </aside>
    <main><div class="page enter" key=${page+(arg==null?"":String(arg))}>${views[page]}</div></main>
    ${it&&html`<${ProductModal} key=${it.key} it=${it} onClose=${()=>setOpenKey(null)} go=${go} update=${update}/>`}
    ${cmd&&html`<${Cmdk} onClose=${()=>setCmd(false)} go=${go} open=${setOpenKey} data=${data}/>`}
    <${Toast}/>
  </div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
})();
</script>
